name: Build DZpeinture Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compiler DZpeinture-Admin.apk
        run: gradle assembleDebug --no-daemon

      - name: Renommer en DZpeinture-Admin.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk DZpeinture-Admin.apk

      - name: Publier DZpeinture-Admin.apk
        uses: actions/upload-artifact@v4
        with:
          name: DZpeinture-Admin-APK
          path: DZpeinture-Admin.apk
          retention-days: 90
